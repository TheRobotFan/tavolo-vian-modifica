<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E3B2C">
<meta name="robots" content="noindex,nofollow">
<title>All In Vian · Carta bruciata</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  body {
    min-height: 100dvh; display: grid; place-items: center; padding: 24px;
    background: radial-gradient(120% 90% at 50% 0%, #17553f, #0E3B2C 70%);
    color: #FFECD1; font-family: Inter, system-ui, sans-serif; text-align: center;
  }
  .carta {
    width: min(100%, 420px); padding: 46px 30px 36px; border-radius: 20px;
    background: radial-gradient(150% 110% at 28% -10%, #fffdf6, #f5ecd6 55%, #eadfc0);
    color: #15616D; box-shadow: 0 34px 70px rgba(0,0,0,.55), inset 0 0 0 1px rgba(138,95,23,.35), inset 0 0 0 6px rgba(255,253,246,.7);
  }
  .seme { font: 700 2rem Georgia, serif; color: #8F1018; }
  .n { font: 800 4.6rem/1 'Playfair Display', Georgia, serif; margin: 10px 0 2px; }
  h1 { font: 700 1.5rem/1.2 'Playfair Display', Georgia, serif; margin: 0 0 10px; }
  p { font-size: .9rem; line-height: 1.55; color: rgba(21,97,109,.8); margin: 0 0 24px; }
  a {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 14px 26px; border-radius: 999px; text-decoration: none;
    background: #FFECD1; color: #15616D; font-weight: 600; border: 2px solid #D9A441;
    box-shadow: 0 10px 22px rgba(0,0,0,.3);
  }
  a:hover { transform: translateY(-2px); }
</style>
</head>
<body>
  <div class="carta">
    <span class="seme" aria-hidden="true">♠</span>
    <p class="n">404</p>
    <h1>La carta si è bruciata</h1>
    <p>Il punto che cercavi non è più in mano a nessuno. Torna al tavolo: lì le carte le distribuiamo noi.</p>
    <a href="./index.html">Torna al tavolo</a>
  </div>
</body>
</html>
